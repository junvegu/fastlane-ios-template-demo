
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true   # ⚠️ Clona también el core Fastlane

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install Fastlane
        run: bundle install

      - name: Run Fastlane CI
        env:
          SCHEME: TestLibraryiOSFastlane
          USE_SWIFTLINT: true
        run: bundle exec fastlane ci
