name: iOS CI with Fastlane (SPM)

on:
  push:
    branches: [ quik ]
  pull_request:
    branches: [ quik ]

jobs:
  ios-ci:
    name: iOS CI
    runs-on: macos-13

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3

      - name: 🧰 Install Swift 6.1
        run: |
          curl -L -o swift.pkg https://download.swift.org/swift-6.1-release/xcode/swift-6.1-RELEASE/swift-6.1-RELEASE-osx.pkg
          sudo installer -pkg swift.pkg -target /
          rm swift.pkg
          echo "/Library/Developer/Toolchains/swift-6.1-RELEASE.xctoolchain/usr/bin" >> $GITHUB_PATH

      - name: ✅ Verify Swift version
        run: swift --version

      - name: 🛠️ Install macOS SDK and dev tools
        run: |
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> $GITHUB_ENV

      - name: 💎 Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1

      - name: 💾 Cache vendor/bundle
        uses: actions/cache@v3
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-

      - name: 📦 Install Fastlane and Ruby dependencies
        run: |
          gem install bundler
          bundle config set --local path 'vendor/bundle'
          bundle install

      - name: 🚀 Run Fastlane
        run: USE_SWIFTLINT=true IS_SPM=true SCHEME=NombreDeTuEsquema bundle exec fastlane ios ci
